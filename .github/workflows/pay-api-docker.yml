name: Publish pay-api to GHCR

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pay-api-docker.yml"
      - "rust/crates/pay-api/**"
      - "rust/crates/pay-api-core/**"
      - "rust/crates/pay-api-types/**"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
  workflow_dispatch:
    inputs:
      push:
        description: "Push image to GHCR"
        required: true
        default: false
        type: boolean

env:
  IMAGE: ghcr.io/solana-foundation/pay-api

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: ./rust
          file: ./rust/crates/pay-api/Dockerfile
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
