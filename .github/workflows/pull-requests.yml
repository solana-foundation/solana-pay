name: Pull requests

on:
  pull_request:

jobs:
  # ── TypeScript SDK (typescript/packages/solana-pay/core/) ──
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./typescript

    name: Lint, format, and typecheck

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: current

      - name: Install Dependencies
        run: pnpm install

      - name: Lint
        run: pnpm --filter @solana/pay lint

      - name: Typecheck
        run: pnpm --filter @solana/pay typecheck

  unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./typescript

    strategy:
      matrix:
        node:
          - "current"
          - "lts/*"

    name: Run unit tests on Node ${{ matrix.node }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install Dependencies
        run: pnpm install

      - name: Run unit tests
        run: pnpm --filter @solana/pay test

  # ── Rust CLI (rust/) ──
  cli-check:
    name: CLI check
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./rust

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Format
        run: cargo fmt --check

      - name: Lint (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Lint (server + redis-session-store)
        run: cargo clippy --workspace --all-targets --features "server,redis-session-store" -- -D warnings

      - name: Test (default features)
        run: cargo test --workspace

      - name: Test (server + redis-session-store)
        env:
          PAY_SESSION_REDIS_URL: redis://127.0.0.1:6379
          PAY_REQUIRE_REDIS_TESTS: "1"
        run: cargo test --workspace --features "server,redis-session-store"
