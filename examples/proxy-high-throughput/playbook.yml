---
- name: Provision a high-throughput Pay proxy
  hosts: pay_proxies
  become: true
  gather_facts: true

  vars:
    pay_git_repo: "https://github.com/solana-foundation/pay.git"
    pay_git_ref: "5ae1a9976de892a9790edc70ed83b8da21d28380"
    pay_rust_toolchain: "nightly-2026-08-14"
    pay_rustflags: "-C target-cpu=native"
    pay_require_avx512_ifma: true
    pay_min_logical_cpus: 128
    pay_service_user: "pay-proxy"
    pay_source_dir: "/opt/pay/src"
    pay_target_dir: "/opt/pay/target"
    pay_cargo_home: "/opt/pay/cargo"
    pay_rustup_home: "/opt/pay/rustup"
    pay_rustup_target: "x86_64-unknown-linux-gnu"
    pay_rustup_init_sha256: "4acc9acc76d5079515b46346a485974457b5a79893cfb01112423c89aeb5aa10"
    pay_install_dir: "/opt/pay/bin"
    pay_config_dir: "/etc/pay-proxy"
    pay_tls_dir: "{{ pay_config_dir }}/tls"
    pay_tls_ca_cert: "{{ pay_tls_dir }}/ca.crt"
    pay_tls_ca_key: "{{ pay_tls_dir }}/ca.key"
    pay_tls_cert: "{{ pay_tls_dir }}/server.crt"
    pay_tls_key: "{{ pay_tls_dir }}/server.key"
    pay_proxy_public_ip: "{{ ansible_host }}"
    pay_proxy_port: 443
    pay_proxy_bind: "0.0.0.0:{{ pay_proxy_port }}"
    pay_proxy_env_file: ""
    pay_proxy_nofile: 524288
    # Optional unmetered control endpoint ("N2 control" in the Sunburst 1M/s
    # investigation): same operator/transport/TLS stack, no session/voucher
    # verification, used to isolate transport cost from paid-path business
    # logic. Off by default; set -e pay_proxy_null_enabled=true to deploy it
    # alongside the paid proxy on a second port.
    pay_proxy_null_enabled: false
    pay_proxy_null_port: 8443
    pay_proxy_null_bind: "0.0.0.0:{{ pay_proxy_null_port }}"

  environment:
    CARGO_HOME: "{{ pay_cargo_home }}"
    CARGO_TARGET_DIR: "{{ pay_target_dir }}"
    RUSTUP_HOME: "{{ pay_rustup_home }}"
    RUSTFLAGS: "{{ pay_rustflags }}"
    PATH: "{{ pay_cargo_home }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

  pre_tasks:
    - name: Validate the target and required inputs
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_architecture in ["x86_64", "amd64"]
          - ansible_processor_vcpus | int >= pay_min_logical_cpus | int
          - pay_git_ref | length == 40
          - pay_proxy_env_file | length > 0
          - pay_proxy_public_ip is match('^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$')
        fail_msg: >-
          This playbook requires x86_64 Ubuntu with at least
          {{ pay_min_logical_cpus }} logical CPUs, an immutable 40-character
          pay_git_ref, a literal pay_proxy_public_ip, and
          -e pay_proxy_env_file=/secure/path/proxy.env.

    - name: Read CPU flags
      ansible.builtin.command: awk -F ':' '/^flags/{print $2; exit}' /proc/cpuinfo
      register: pay_cpu_flags
      changed_when: false

    - name: Require AVX-512 IFMA when requested
      ansible.builtin.assert:
        that:
          - "'avx512ifma' in pay_cpu_flags.stdout.split()"
        fail_msg: >-
          This CPU does not advertise avx512ifma. Set
          pay_require_avx512_ifma=false for a portable build; it will not
          reproduce the measured high-throughput backend.
      when: pay_require_avx512_ifma | bool

    - name: Check the controller-side secret file
      become: false
      delegate_to: localhost
      ansible.builtin.stat:
        path: "{{ pay_proxy_env_file }}"
      register: pay_proxy_env_source

    - name: Require the controller-side secret file
      ansible.builtin.assert:
        that:
          - pay_proxy_env_source.stat.isreg | default(false)
          - pay_proxy_env_source.stat.mode in ["0400", "0600"]
        fail_msg: >-
          The controller file {{ pay_proxy_env_file }} must exist, be a regular
          file, and have mode 0400 or 0600.

  tasks:
    - name: Install build dependencies
      ansible.builtin.apt:
        name:
          - binutils
          - build-essential
          - ca-certificates
          - clang
          - cmake
          - curl
          - git
          - libssl-dev
          - openssl
          - pkg-config
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the service account
      ansible.builtin.user:
        name: "{{ pay_service_user }}"
        system: true
        create_home: true
        home: "/var/lib/{{ pay_service_user }}"
        shell: /usr/sbin/nologin

    - name: Create Pay directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "/opt/pay", owner: "{{ pay_service_user }}", group: "{{ pay_service_user }}", mode: "0755" }
        - { path: "{{ pay_source_dir }}", owner: "{{ pay_service_user }}", group: "{{ pay_service_user }}", mode: "0755" }
        - { path: "{{ pay_target_dir }}", owner: "{{ pay_service_user }}", group: "{{ pay_service_user }}", mode: "0755" }
        - { path: "{{ pay_cargo_home }}", owner: "{{ pay_service_user }}", group: "{{ pay_service_user }}", mode: "0755" }
        - { path: "{{ pay_rustup_home }}", owner: "{{ pay_service_user }}", group: "{{ pay_service_user }}", mode: "0755" }
        - { path: "{{ pay_install_dir }}", owner: "root", group: "root", mode: "0755" }
        - { path: "{{ pay_config_dir }}", owner: "root", group: "{{ pay_service_user }}", mode: "0750" }
        - { path: "{{ pay_tls_dir }}", owner: "root", group: "{{ pay_service_user }}", mode: "0750" }
        - { path: "/usr/local/src", owner: "root", group: "root", mode: "0755" }

    - name: Install the TLS certificate profile
      ansible.builtin.template:
        src: templates/pay-proxy-openssl.cnf.j2
        dest: "{{ pay_tls_dir }}/openssl.cnf"
        owner: root
        group: root
        mode: "0644"

    - name: Generate the benchmark CA private key
      ansible.builtin.command:
        cmd: >-
          openssl genpkey -algorithm RSA
          -pkeyopt rsa_keygen_bits:3072 -out {{ pay_tls_ca_key }}
        creates: "{{ pay_tls_ca_key }}"

    - name: Generate the benchmark CA certificate
      ansible.builtin.command:
        cmd: >-
          openssl req -x509 -new -sha256 -days 3650
          -key {{ pay_tls_ca_key }} -out {{ pay_tls_ca_cert }}
          -config {{ pay_tls_dir }}/openssl.cnf -extensions ca_cert
          -subj /CN=Pay-benchmark-CA
        creates: "{{ pay_tls_ca_cert }}"

    - name: Generate the proxy TLS private key
      ansible.builtin.command:
        cmd: >-
          openssl genpkey -algorithm RSA
          -pkeyopt rsa_keygen_bits:3072 -out {{ pay_tls_key }}
        creates: "{{ pay_tls_key }}"

    - name: Generate the proxy TLS certificate request
      ansible.builtin.command:
        cmd: >-
          openssl req -new -sha256 -key {{ pay_tls_key }}
          -out {{ pay_tls_dir }}/server.csr
          -subj /CN={{ pay_proxy_public_ip }}
        creates: "{{ pay_tls_dir }}/server.csr"

    - name: Sign the proxy TLS certificate
      ansible.builtin.command:
        cmd: >-
          openssl x509 -req -sha256 -days 825
          -in {{ pay_tls_dir }}/server.csr
          -CA {{ pay_tls_ca_cert }} -CAkey {{ pay_tls_ca_key }} -CAcreateserial
          -extfile {{ pay_tls_dir }}/openssl.cnf -extensions server_cert
          -out {{ pay_tls_cert }}
        creates: "{{ pay_tls_cert }}"

    - name: Restrict TLS private keys and expose certificates
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ pay_tls_ca_key }}", group: "root", mode: "0600" }
        - { path: "{{ pay_tls_key }}", group: "{{ pay_service_user }}", mode: "0640" }
        - { path: "{{ pay_tls_ca_cert }}", group: "root", mode: "0644" }
        - { path: "{{ pay_tls_cert }}", group: "{{ pay_service_user }}", mode: "0640" }

    - name: Verify the proxy TLS certificate chain
      ansible.builtin.command: >-
        openssl verify -CAfile {{ pay_tls_ca_cert }} {{ pay_tls_cert }}
      changed_when: false

    - name: Verify the proxy TLS certificate covers the public IP
      ansible.builtin.command: >-
        openssl x509 -in {{ pay_tls_cert }} -noout
        -checkip {{ pay_proxy_public_ip }}
      changed_when: false

    - name: Fetch the benchmark CA certificate for load generators
      ansible.builtin.fetch:
        src: "{{ pay_tls_ca_cert }}"
        dest: "{{ playbook_dir }}/artifacts/{{ inventory_hostname }}-ca.crt"
        flat: true

    - name: Install rustup
      ansible.builtin.get_url:
        url: >-
          https://static.rust-lang.org/rustup/dist/{{ pay_rustup_target }}/rustup-init
        checksum: "sha256:{{ pay_rustup_init_sha256 }}"
        dest: /usr/local/src/rustup-init
        owner: root
        group: root
        mode: "0755"

    - name: Initialize rustup for the service account
      become: true
      become_user: "{{ pay_service_user }}"
      ansible.builtin.command:
        cmd: /usr/local/src/rustup-init -y --no-modify-path --profile minimal
      args:
        creates: "{{ pay_cargo_home }}/bin/rustup"

    - name: Install the pinned Rust toolchain
      become: true
      become_user: "{{ pay_service_user }}"
      ansible.builtin.command:
        cmd: >-
          {{ pay_cargo_home }}/bin/rustup toolchain install
          {{ pay_rust_toolchain }} --profile minimal
      register: pay_rustup_install
      changed_when: >-
        'unchanged' not in (pay_rustup_install.stdout + pay_rustup_install.stderr)

    - name: Check out the immutable Pay revision
      become: true
      become_user: "{{ pay_service_user }}"
      ansible.builtin.git:
        repo: "{{ pay_git_repo }}"
        dest: "{{ pay_source_dir }}"
        version: "{{ pay_git_ref }}"
        update: true
        force: false

    - name: Read the checked-out Pay revision
      become: true
      become_user: "{{ pay_service_user }}"
      ansible.builtin.command: git rev-parse HEAD
      args:
        chdir: "{{ pay_source_dir }}"
      register: pay_checked_out_ref
      changed_when: false

    - name: Verify the checked-out Pay revision
      ansible.builtin.assert:
        that:
          - pay_checked_out_ref.stdout == pay_git_ref
        fail_msg: >-
          Expected Pay {{ pay_git_ref }}, but git checked out
          {{ pay_checked_out_ref.stdout }}.

    - name: Build the proxy and benchmark harness
      become: true
      become_user: "{{ pay_service_user }}"
      environment:
        PAY_PDB_ALLOW_PLACEHOLDER: "1"
      ansible.builtin.command:
        cmd: >-
          {{ pay_cargo_home }}/bin/cargo +{{ pay_rust_toolchain }}
          build --release --locked -p pay -p pay-bench
        chdir: "{{ pay_source_dir }}/rust"
      register: pay_build
      changed_when: "'Finished' in pay_build.stderr and '0.00s' not in pay_build.stderr"

    - name: Verify the build contains AVX-512 IFMA instructions
      ansible.builtin.shell: |
        set -euo pipefail
        objdump -d "{{ pay_target_dir }}/release/pay" \
          | awk '/vpmadd52/{found=1} END{exit !found}'
      args:
        executable: /bin/bash
      changed_when: false
      when: pay_require_avx512_ifma | bool

    - name: Install the release binaries
      ansible.builtin.copy:
        src: "{{ pay_target_dir }}/release/{{ item.src }}"
        dest: "{{ pay_install_dir }}/{{ item.dest }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      loop:
        - { src: "pay", dest: "pay" }
        - { src: "bench", dest: "pay-bench" }
      notify: Restart pay-proxy

    - name: Install kernel and socket tuning
      ansible.builtin.template:
        src: templates/99-pay-proxy.conf.j2
        dest: /etc/sysctl.d/99-pay-proxy.conf
        owner: root
        group: root
        mode: "0644"
      notify: Apply sysctl tuning

    - name: Install the proxy paywall
      ansible.builtin.copy:
        src: files/paywall.yml
        dest: "{{ pay_config_dir }}/paywall.yml"
        owner: root
        group: "{{ pay_service_user }}"
        mode: "0640"
      notify: Restart pay-proxy

    - name: Install the unmetered control paywall
      ansible.builtin.copy:
        src: files/paywall-null.yml
        dest: "{{ pay_config_dir }}/paywall-null.yml"
        owner: root
        group: "{{ pay_service_user }}"
        mode: "0640"
      when: pay_proxy_null_enabled | bool
      notify: Restart pay-proxy-null

    - name: Install the secret environment file
      ansible.builtin.copy:
        src: "{{ pay_proxy_env_file }}"
        dest: "{{ pay_config_dir }}/proxy.env"
        owner: root
        group: "{{ pay_service_user }}"
        mode: "0640"
      no_log: true
      notify: Restart pay-proxy

    - name: Install the systemd service
      ansible.builtin.template:
        src: templates/pay-proxy.service.j2
        dest: /etc/systemd/system/pay-proxy.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart pay-proxy

    - name: Install the unmetered control systemd service
      ansible.builtin.template:
        src: templates/pay-proxy-null.service.j2
        dest: /etc/systemd/system/pay-proxy-null.service
        owner: root
        group: root
        mode: "0644"
      when: pay_proxy_null_enabled | bool
      notify: Restart pay-proxy-null

    - name: Flush configuration handlers
      ansible.builtin.meta: flush_handlers

    - name: Enable and start the proxy
      ansible.builtin.systemd_service:
        name: pay-proxy
        enabled: true
        state: started
        daemon_reload: true

    - name: Enable and start the unmetered control proxy
      ansible.builtin.systemd_service:
        name: pay-proxy-null
        enabled: true
        state: started
        daemon_reload: true
      when: pay_proxy_null_enabled | bool

    - name: Verify the paid endpoint returns a challenge
      ansible.builtin.uri:
        url: "https://{{ pay_proxy_public_ip }}:{{ pay_proxy_port }}/api/v1/compute"
        method: GET
        status_code: 402
        return_content: false
        ca_path: "{{ pay_tls_ca_cert }}"
      register: pay_challenge
      retries: 12
      delay: 1
      until: pay_challenge.status == 402

    - name: Verify the unmetered control endpoint returns 200
      ansible.builtin.uri:
        url: "https://{{ pay_proxy_public_ip }}:{{ pay_proxy_null_port }}/api/v1/null"
        method: GET
        status_code: 200
        return_content: false
        ca_path: "{{ pay_tls_ca_cert }}"
      register: pay_null_challenge
      retries: 12
      delay: 1
      until: pay_null_challenge.status == 200
      when: pay_proxy_null_enabled | bool

  handlers:
    - name: Apply sysctl tuning
      ansible.builtin.command: sysctl --system
      changed_when: true

    - name: Restart pay-proxy
      ansible.builtin.systemd_service:
        name: pay-proxy
        state: restarted
        enabled: true
        daemon_reload: true

    - name: Restart pay-proxy-null
      ansible.builtin.systemd_service:
        name: pay-proxy-null
        state: restarted
        enabled: true
        daemon_reload: true
      when: pay_proxy_null_enabled | bool

- name: Provision a load generator for the high-throughput Pay proxy
  hosts: pay_generators
  become: true
  gather_facts: true

  vars:
    pay_git_repo: "https://github.com/solana-foundation/pay.git"
    pay_rustflags: "-C target-cpu=native"
    pay_min_logical_cpus: 8
    pay_generator_user: "{{ ansible_user }}"
    pay_generator_dir: "/home/{{ pay_generator_user }}/pay-bench"
    pay_source_dir: "{{ pay_generator_dir }}/src"
    pay_target_dir: "{{ pay_generator_dir }}/target"
    pay_cargo_home: "{{ pay_generator_dir }}/cargo"
    pay_rustup_home: "{{ pay_generator_dir }}/rustup"
    pay_rustup_target: "x86_64-unknown-linux-gnu"
    pay_rustup_init_sha256: "4acc9acc76d5079515b46346a485974457b5a79893cfb01112423c89aeb5aa10"
    # Generators need the same ephemeral-port headroom and SYN backlog as
    # the proxy: they are the other end of every connection this benchmark
    # opens, and a host running several load-generating processes at once
    # can exhaust the *default* ~28k-port ephemeral range well before the
    # proxy's own limits matter (see Sunburst 1M/s investigation, 2026-08-19
    # 10-process test: a freshly-provisioned generator without this tuning
    # failed catastrophically — >99% connect errors — while an identically
    # loaded, already-tuned generator on the same run stayed healthy).
    pay_generator_nofile: 262144

  environment:
    CARGO_HOME: "{{ pay_cargo_home }}"
    CARGO_TARGET_DIR: "{{ pay_target_dir }}"
    RUSTUP_HOME: "{{ pay_rustup_home }}"
    RUSTFLAGS: "{{ pay_rustflags }}"
    PATH: "{{ pay_cargo_home }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

  pre_tasks:
    - name: Validate the target
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_architecture in ["x86_64", "amd64"]
          - ansible_processor_vcpus | int >= pay_min_logical_cpus | int
          - pay_git_ref | length == 40
        fail_msg: >-
          This playbook requires x86_64 Ubuntu with at least
          {{ pay_min_logical_cpus }} logical CPUs and an immutable
          40-character pay_git_ref.

  tasks:
    - name: Install build dependencies
      ansible.builtin.apt:
        name:
          - binutils
          - build-essential
          - ca-certificates
          - clang
          - cmake
          - curl
          - git
          - libssl-dev
          - openssl
          - pkg-config
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create generator directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ pay_generator_user }}"
        group: "{{ pay_generator_user }}"
        mode: "0755"
      loop:
        - "{{ pay_generator_dir }}"
        - "{{ pay_source_dir }}"
        - "{{ pay_target_dir }}"
        - "{{ pay_cargo_home }}"
        - "{{ pay_rustup_home }}"
        - "{{ pay_generator_dir }}/reports"

    - name: Install kernel and socket tuning (same profile as the proxy)
      ansible.builtin.template:
        src: templates/99-pay-proxy.conf.j2
        dest: /etc/sysctl.d/99-pay-proxy.conf
        owner: root
        group: root
        mode: "0644"
      notify: Apply sysctl tuning

    # LimitNOFILE in a systemd unit only bounds a *service*; ad-hoc
    # `bench run` invocations over SSH inherit PAM's session limits
    # instead. Without this, every run script needs its own `ulimit -n`
    # line and it's easy to forget on a freshly provisioned host.
    - name: Raise the default open-file limit for interactive sessions
      ansible.builtin.copy:
        dest: /etc/security/limits.d/99-pay-bench.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible: proxy-high-throughput example (generator role).
          {{ pay_generator_user }} soft nofile {{ pay_generator_nofile }}
          {{ pay_generator_user }} hard nofile 524288

    - name: Install rustup
      ansible.builtin.get_url:
        url: >-
          https://static.rust-lang.org/rustup/dist/{{ pay_rustup_target }}/rustup-init
        checksum: "sha256:{{ pay_rustup_init_sha256 }}"
        dest: /usr/local/src/rustup-init
        owner: root
        group: root
        mode: "0755"

    - name: Initialize rustup for the generator user
      become: true
      become_user: "{{ pay_generator_user }}"
      ansible.builtin.command:
        cmd: /usr/local/src/rustup-init -y --no-modify-path --profile minimal
      args:
        creates: "{{ pay_cargo_home }}/bin/rustup"

    - name: Install the pinned Rust toolchain
      become: true
      become_user: "{{ pay_generator_user }}"
      ansible.builtin.command:
        cmd: >-
          {{ pay_cargo_home }}/bin/rustup toolchain install
          {{ pay_rust_toolchain }} --profile minimal
      register: pay_rustup_install
      changed_when: >-
        'unchanged' not in (pay_rustup_install.stdout + pay_rustup_install.stderr)

    - name: Check out the immutable Pay revision
      become: true
      become_user: "{{ pay_generator_user }}"
      ansible.builtin.git:
        repo: "{{ pay_git_repo }}"
        dest: "{{ pay_source_dir }}"
        version: "{{ pay_git_ref }}"
        update: true
        force: false

    - name: Build the benchmark harness
      become: true
      become_user: "{{ pay_generator_user }}"
      environment:
        PAY_PDB_ALLOW_PLACEHOLDER: "1"
      ansible.builtin.command:
        cmd: >-
          {{ pay_cargo_home }}/bin/cargo +{{ pay_rust_toolchain }}
          build --release --locked -p pay-bench
        chdir: "{{ pay_source_dir }}/rust"
      register: pay_bench_build
      changed_when: "'Finished' in pay_bench_build.stderr and '0.00s' not in pay_bench_build.stderr"

    # The proxy play (earlier in this same file) fetches its CA certificate
    # to the controller as artifacts/<proxy-inventory-name>-ca.crt. Run both
    # plays in one `ansible-playbook` invocation (the default — plays run in
    # file order) so that file exists by the time this task runs.
    - name: Install the benchmark CA certificate fetched from the proxy
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/artifacts/{{ groups['pay_proxies'][0] }}-ca.crt"
        dest: "{{ pay_generator_dir }}/ca.crt"
        owner: "{{ pay_generator_user }}"
        group: "{{ pay_generator_user }}"
        mode: "0644"

  handlers:
    - name: Apply sysctl tuning
      ansible.builtin.command: sysctl --system
      changed_when: true
