# Unmetered control endpoint — same operator/transport/TLS stack as
# paywall.yml, but no `metering` block on the endpoint and no `session`
# block, so the payment middleware passes every request straight through
# with zero session/voucher verification. This is the "N2 control" used
# throughout the Sunburst 1M/s investigation to isolate whether the paid
# path's business logic (vs. transport/client) owns an observed throughput
# ceiling. Previously hand-rolled per-run via ad-hoc `systemd-run` with no
# LimitNOFILE override — which silently capped it at 1,024 open files and
# caused every connection past that point to fail its TLS handshake under
# load. Folding it into this playbook gives it the same LimitNOFILE/sysctl
# hygiene as the paid proxy, once and for all.
name: proxy-high-throughput-null
subdomain: proxy-high-throughput-null
title: "High-throughput Pay proxy — unmetered control"
description: "N2 control: free passthrough endpoint, same stack, no vouchers."
category: ai_ml
version: v1

routing:
  type: respond

accounting: pooled

operator:
  recipient: "${PAY_PAYMENT_RECIPIENT}"
  currencies:
    usd: ["USDtest"]
  network: devnet
  rpc_url: "${PAY_RPC_URL}"
  fee_payer: true
  signer:
    backend: env
    value_from_env: PAY_OPERATOR_KEYPAIR
  challenge_binding_secret: "${PAY_SESSION_SECRET}"

endpoints:
  - method: GET
    path: "api/v1/null"
    resource: "null"
    description: "N2 control: static 200, no metering, no vouchers."
