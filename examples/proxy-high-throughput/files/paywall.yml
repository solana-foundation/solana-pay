# Gate-only endpoint for measuring MPP-session voucher verification. The
# direct response intentionally excludes upstream application work.
name: proxy-high-throughput
subdomain: proxy-high-throughput
title: "High-throughput Pay proxy"
description: "MPP-session voucher verification benchmark endpoint."
category: ai_ml
version: v1

routing:
  type: respond

accounting: pooled

operator:
  recipient: "${PAY_PAYMENT_RECIPIENT}"
  currencies:
    usd: ["USDC"]
  network: devnet
  rpc_url: "${PAY_RPC_URL}"
  fee_payer: true
  signer:
    backend: env
    value_from_env: PAY_OPERATOR_KEYPAIR
  challenge_binding_secret: "${PAY_SESSION_SECRET}"

session:
  cap_usdc: 0.01
  min_voucher_delta: 1
  voucher_signer: client
  close_delay_ms: 600000
  close_batch_interval_ms: 60000
  # Requests only verify and persist cumulative vouchers locally. Every five
  # minutes the lifecycle worker submits each channel's latest watermark,
  # packing concurrent settlements into size-safe Solana transactions.
  settlement_interval_ms: 300000

endpoints:
  - method: GET
    path: "api/v1/compute"
    resource: "compute"
    description: "Returns 200 after validating an MPP session voucher."
    metering:
      schemes: [mpp-session]
      dimensions:
        - direction: usage
          unit: requests
          scale: 1
          tiers:
            - price_usd: 0.000001
