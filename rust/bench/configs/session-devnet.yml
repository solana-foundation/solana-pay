# Start this at a small user count after `devnet-fixture-100k-usdtest.yml` is ready.
# Increase `load.users` only after the previous run is clean; it must not
# exceed the number of wallets in the selected --fixture-id.
run:
  name: session-devnet
  scheme: mpp_session
  network: devnet
  rpc_url_env: BENCH_DEVNET_RPC_URL
  mint: 6MJyWHwFpPsaTEuYarEz49ngtsSKPYn6yHqtJUW2a9St
  # TLS is optional. The gate serves plaintext on 127.0.0.1:1402 for a
  # co-located or SSH-tunnelled run. To reach a remote gate, start it with a
  # cert (`pay server start --tls-cert --tls-key`), point the endpoint below at
  # `https://<host>:1402/...`, and uncomment tls_ca_cert_env to trust its CA.
  # tls_ca_cert_env: BENCH_TLS_CA_CERT
  funder:
    keypair_env: BENCH_FUNDER_KEYPAIR
  safety:
    max_total_usdc: 1.0
    max_total_sol: 2.5
    require_confirmation: true

load:
  users: 100
  requests_per_sec_per_user: 5
  prepare_secs: 5
  unleash_secs: 15
  max_concurrency: 512
  # Sustained public-RPC runs need a lower bound than the short 1k burst.
  provision_concurrency: 128
  # Close requests wait for confirmed on-chain settlement. Bound them
  # independently from request traffic so cleanup scales without RPC storms.
  settlement_concurrency: 64

endpoints:
  - url: http://127.0.0.1:1402/api/v1/compute
    method: GET
    body: ""

session:
  deposit_usdc: 0.01
  voucher_usdc: 0.000001
  settle_onchain: false
  # Cooperatively close and settle every channel before fixture teardown.
  close_after_run: true
