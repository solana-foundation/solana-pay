# Rehearsal: MPP session scheme (push) on a JIT Surfpool mainnet fork — no real funds.
#   cargo run -p pay-bench --release -- rehearse bench/configs/session-fork.yml
#
# Each user = one channel: open once on-chain, then stream off-chain vouchers,
# settle on close. Current PayKit verifies a genuine payment-channel open, so
# this requires a read-only mainnet RPC datasource with the channel program and
# USDC mint available. Keep
# deposit_usdc >= unleash_secs * requests_per_sec_per_user * voucher_usdc.
run:
  name: session-fork
  scheme: mpp_session
  network: fork
  rpc_url_env: BENCH_FORK_RPC_URL
  safety:
    max_total_usdc: 1000.0
    max_total_sol: 1000.0
    require_confirmation: false

load:
  users: 20
  requests_per_sec_per_user: 5
  prepare_secs: 5
  unleash_secs: 8
  max_concurrency: 512

endpoints:
  - url: "http://placeholder.local/v1/charge"  # overridden in rehearsal
    method: POST
    body: "{}"

session:
  deposit_usdc: 1.0      # USDC locked per user channel
  voucher_usdc: 0.001    # per-request voucher increment
