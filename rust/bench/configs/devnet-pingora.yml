# A headless Pingora gateway for a real devnet MPP-session smoke test.
#
# This intentionally uses `routing: respond`: the public gate performs the
# complete 402/session-voucher verification path before returning 200, while
# keeping an upstream application out of the capacity measurement.
#
# Required runtime environment (do not commit these values):
#   PAY_PAYMENT_RECIPIENT  a devnet recipient public key
#   PAY_RPC_URL            a devnet Solana RPC URL
#   PAY_MPP_SECRET         stable random hex secret; preserves MPP session tokens
#                           across service restarts
#   PAY_SETTLEMENT_KEYPAIR_PATH
#                           path to the recipient's devnet keypair; it sponsors
#                           opens and settles/distributes closed channels
name: pay-bench-devnet
subdomain: pay-bench-devnet
title: "Pay Bench Devnet"
description: "Devnet MPP-session Pingora smoke endpoint."
category: ai_ml
version: v1

routing:
  type: respond

accounting: pooled

operator:
  signer:
    backend: file
    path: "${PAY_SETTLEMENT_KEYPAIR_PATH}"
  recipient: "${PAY_PAYMENT_RECIPIENT}"
  currencies:
    usd: ["USDtest"]
  network: devnet
  rpc_url: "${PAY_RPC_URL}"
  # Exercise draft-00 sponsorship: the client signs the stablecoin authority;
  # the gateway pays the transaction fee + channel rent and broadcasts.
  fee_payer: true
  challenge_binding_secret: "${PAY_MPP_SECRET}"

session:
  # Keep enough headroom for sustained reuse runs without reopening channels.
  cap_usdc: 5.0
  min_voucher_delta: 1
  # Advance the on-chain watermark periodically during long reuse runs.
  close_delay_ms: 0
  settlement_interval_ms: 120000
  # Allow a restarted gateway to resume channels opened by a prior run.
  reuse_from_chain: true

endpoints:
  - method: GET
    path: "api/v1/compute"
    resource: "compute"
    description: "Returns 200 after verifying an MPP session voucher."
    metering:
      schemes: [mpp-session]
      dimensions:
        - direction: usage
          unit: requests
          scale: 1
          tiers:
            - price_usd: 0.000001
