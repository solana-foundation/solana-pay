# A headless Pingora gateway for a real devnet MPP-session smoke test.
#
# This intentionally uses `routing: respond`: the public gate performs the
# complete 402/session-voucher verification path before returning 200, while
# keeping an upstream application out of the capacity measurement.
#
# Required runtime environment (do not commit these values):
#   PAY_PAYMENT_RECIPIENT  a devnet recipient public key
#   PAY_RPC_URL            a devnet Solana RPC URL
#   PAY_SESSION_SECRET     stable random hex secret; preserves session tokens
#                           across service restarts
name: pay-bench-devnet
subdomain: pay-bench-devnet
title: "Pay Bench Devnet"
description: "Devnet MPP-session Pingora smoke endpoint."
category: ai_ml
version: v1

routing:
  type: respond

accounting: pooled

operator:
  recipient: "${PAY_PAYMENT_RECIPIENT}"
  currencies:
    usd: ["USDC"]
  network: devnet
  rpc_url: "${PAY_RPC_URL}"
  # The client funds and opens the channel, so this gate does not require an
  # operator signing key for the smoke endpoint.
  fee_payer: false
  challenge_binding_secret: "${PAY_SESSION_SECRET}"

session:
  cap_usdc: 0.01
  min_voucher_delta: 1
  # Do not spend operator fees closing channels during a gateway smoke test.
  close_delay_ms: 0
  settlement_interval_ms: 0

endpoints:
  - method: GET
    path: "api/v1/compute"
    resource: "compute"
    description: "Returns 200 after verifying an MPP session voucher."
    metering:
      schemes: [mpp-session]
      dimensions:
        - direction: usage
          unit: requests
          scale: 1
          tiers:
            - price_usd: 0.000001
