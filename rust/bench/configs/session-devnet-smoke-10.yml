# First live USDtest stage. Reuses the first ten wallets from the bounded
# 100-wallet fixture and closes every channel before returning.
run:
  name: session-devnet-smoke-10
  scheme: mpp_session
  network: devnet
  rpc_url_env: BENCH_DEVNET_RPC_URL
  mint: 6MJyWHwFpPsaTEuYarEz49ngtsSKPYn6yHqtJUW2a9St
  tls_ca_cert_env: BENCH_TLS_CA_CERT
  funder:
    keypair_env: BENCH_FUNDER_KEYPAIR
  safety:
    max_total_usdc: 0.1
    max_total_sol: 0.25
    require_confirmation: true

load:
  users: 10
  requests_per_sec_per_user: 5
  prepare_secs: 5
  unleash_secs: 15
  max_concurrency: 64

endpoints:
  - url: https://213.239.141.29/api/v1/compute
    method: GET
    body: ""

session:
  deposit_usdc: 0.01
  voucher_usdc: 0.000001
  settle_onchain: false
  close_after_run: true
