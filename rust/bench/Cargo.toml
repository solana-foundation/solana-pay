[package]
name = "pay-bench"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "bench"
path = "src/main.rs"

# Not a workspace default-member: a plain `cargo build` skips it (and its heavy
# surfpool/solana dep tree). Build/run explicitly with `-p pay-bench`.

[dependencies]
pay-core = { workspace = true, features = ["server", "otel"] }
pay-api-core = { path = "../crates/pay-api-core" }
pay-worker = { path = "../crates/pay-worker" }
pay-proxy = { workspace = true }
pay-types = { workspace = true }
pay-kit = { workspace = true }
solana-pubkey = { workspace = true }
solana-message = { workspace = true }
solana-signature = { workspace = true }
solana-system-interface = { workspace = true }
solana-transaction = { workspace = true }
solana-instruction = { workspace = true }
solana-commitment-config = { workspace = true }
solana-hash = { workspace = true }
solana-account = "3.4.0"
solana-transaction-status-client-types = "4.0.0"

tokio = { workspace = true, features = ["full"] }
tokio-util = "0.7"
reqwest = { workspace = true }
axum = { workspace = true }

# Churn-free HTTP/2 load transport (StableH2Pool) — a fixed set of persistent
# h2 connections instead of reqwest's Ver::Auto churning pool. Versions match
# the reqwest 0.12 stack already resolved in the workspace lock.
hyper = { version = "1", features = ["client", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio-rustls = "0.26"
rustls-pemfile = "2"
webpki-roots = "1"
url = "2"

serde = { workspace = true }
serde_json = { workspace = true }
serde_yml = { workspace = true }

clap = { workspace = true }
chrono = { workspace = true }
bs58 = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
opentelemetry_sdk = { workspace = true }

anyhow = "1"
async-trait = "0.1"
futures = "0.3"
hdrhistogram = "7"
hkdf = "0.12"
sha2 = "0.10"
ed25519-dalek = "2"
dashmap = "5.5"
crossbeam-queue = "0.3"
socket2 = "0.5"
bincode = "1.3"
spl-token-2022-interface = "2.1.0"
solana-program-pack = "3.1"
# CPU flamegraph profiling → Pyroscope (Grafana). pprof-rs sampling backend.
pyroscope = "0.5"
pyroscope_pprofrs = "0.2"

# Embedded validator for rehearsal (fork) runs. Same pinned rev as pay-core's
# dev-dependency so the lock resolves to a single copy.
surfpool-sdk = { git = "https://github.com/solana-foundation/surfpool", rev = "b46c47e06c28ed1aa31e119215b479b70e72d4c3" }

[dev-dependencies]
base64.workspace = true
